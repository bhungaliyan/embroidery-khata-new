<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Job Work Khata - GitHub Version</title>
<style>
body{font-family:system-ui,Arial;margin:0;background:#f3f4f6}header{background:#0f766e;color:#fff;padding:14px 18px}header h1{margin:0;font-size:22px}nav{display:flex;gap:8px;padding:12px;background:#fff;flex-wrap:wrap}nav button{padding:9px 14px;border:1px solid #ddd;border-radius:999px;background:#fff;cursor:pointer}nav button.active{background:#0f766e;color:#fff}main{padding:16px;max-width:1100px;margin:auto}.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.08)}input,select,textarea{width:100%;padding:9px;border:1px solid #ddd;border-radius:8px;margin:5px 0;box-sizing:border-box}button.primary{background:#0f766e;color:#fff;border:0;padding:10px 16px;border-radius:8px;cursor:pointer}button.green{background:#16a34a;color:#fff;border:0;padding:10px 16px;border-radius:8px;cursor:pointer}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ddd;padding:8px;text-align:left}th{background:#f8fafc}.bill{border:2px solid #000;padding:16px;background:#fff}.bill-head{text-align:center;border-bottom:2px solid #000}.bill-head h2{margin:0;font-size:32px}.flex{display:flex;gap:12px}.flex>div{flex:1}.logo-preview{width:90px;height:90px;object-fit:contain;background:#fff;border:1px solid #ddd;border-radius:8px}.small{font-size:13px;color:#555}
</style></head>
<body>
<header><h1>Job Work Khata - GitHub Version</h1><div class="small">Party • Design • Job Work Challan • Delivery Challan • Billing • Payment • Settings - Data is browser me save hota hai (localStorage)</div></header>
<nav id="tabs"></nav>
<main id="app"></main>
<script>
const TABS=["Dashboard","Party Master","Design Master","Job Work Challan","Delivery Challan","Billing","Payment","Settings"];
let tab=TABS[0];
function load(k,def){try{return JSON.parse(localStorage.getItem(k))||def}catch(e){return def}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
let firms=load("firms",[{id:"f1",name:"Kailasa Fabric",mobile:"",gst:"",pan:"",address:"Surat, Gujarat",logo:"",isDefault:true},{id:"f2",name:"Sattva Creation",mobile:"",gst:"",pan:"",address:"Surat, Gujarat",logo:"",isDefault:false}]);
let parties=load("parties",[]); let designs=load("designs",[]); let jobs=load("jobs",[]); let deliveries=load("deliveries",[]); let bills=load("bills",[]); let payments=load("payments",[]);
function persist(){save("firms",firms);save("parties",parties);save("designs",designs);save("jobs",jobs);save("deliveries",deliveries);save("bills",bills);save("payments",payments)}
function esc(s){return String(s??"").replace(/</g,"&lt;")}
function renderTabs(){document.getElementById("tabs").innerHTML=TABS.map(t=>`<button class="${t===tab?"active":""}" onclick="go('${t}')">${t}</button>`).join("")}
function go(t){tab=t;renderTabs();render()}
function num(v){return parseFloat(String(v??"").replace(/[^0-9.]/g,""))||0}
function inWords(n){return "Rupees "+Math.round(n)+" Only";}
// LOGO UPLOAD - GitHub version me direct file upload chalta hai
function onLogo(e,firmId){const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{const firm=firms.find(x=>x.id===firmId); firm.logo=r.result; persist(); render(); alert("Logo lag gaya - ab Bill me dikhega");}; r.readAsDataURL(f);}

function render(){
 const app=document.getElementById("app");
 if(tab==="Dashboard"){let totBills=bills.reduce((a,b)=>a+num(b.total),0); app.innerHTML=`<div class="card"><h2>Dashboard</h2><p>Party: ${parties.length} • Design: ${designs.length} • Job Work Challan: ${jobs.length} • Delivery Challan: ${deliveries.length} • Bill: ${bills.length} • Total Bill: Rs. ${totBills.toFixed(2)}</p><p class="small">GitHub version: Logo direct upload hota hai, Bill ka PDF browser se banega, WhatsApp button se Party ka WhatsApp khulega.</p></div>`; return;}
 if(tab==="Settings"){app.innerHTML=`<div class="card"><h2>Meri Firm - Logo Direct Upload</h2>${firms.map(f=>`<div style="border:1px solid #eee;padding:12px;border-radius:10px;margin:10px 0"><div class="flex"><div>${f.logo?`<img class="logo-preview" src="${f.logo}">`:`<div class="logo-preview" style="display:flex;align-items:center;justify-content:center;font-size:32px">${esc(f.name[0])}</div>`}</div><div><b>${esc(f.name)}</b><br><span class="small">${esc(f.address)} • ${esc(f.mobile)} • GST ${esc(f.gst)}</span><br><label>Logo Direct Upload - Gallery se chuno</label><input type="file" accept="image/*" onchange="onLogo(event,'${f.id}')"> <input placeholder="Firm Name" value="${esc(f.name)}" onchange="firms.find(x=>x.id==='${f.id}').name=this.value;persist();render()"> <input placeholder="Mobile" value="${esc(f.mobile)}" onchange="firms.find(x=>x.id==='${f.id}').mobile=this.value;persist()"> <input placeholder="GSTIN" value="${esc(f.gst)}" onchange="firms.find(x=>x.id==='${f.id}').gst=this.value;persist()"> <input placeholder="PAN" value="${esc(f.pan)}" onchange="firms.find(x=>x.id==='${f.id}').pan=this.value;persist()"> <input placeholder="Address" value="${esc(f.address)}" onchange="firms.find(x=>x.id==='${f.id}').address=this.value;persist()"></div></div></div>`).join("")}<button class="primary" onclick="firms.push({id:'f'+Date.now(),name:'Nayi Firm',mobile:'',gst:'',pan:'',address:'',logo:'',isDefault:false});persist();render()">+ Firm Add Karo</button></div>`; return;}
 if(tab==="Party Master"){app.innerHTML=`<div class="card"><h2>Party Master</h2><input id="pName" placeholder="Party Name"><input id="pCity" placeholder="City / Address"><input id="pMobile" placeholder="Mobile"><input id="pWa" placeholder="WhatsApp Number"><input id="pGst" placeholder="GSTIN"><button class="primary" onclick="parties.push({id:Date.now(),name:document.getElementById('pName').value,city:document.getElementById('pCity').value,mobile:document.getElementById('pMobile').value,wa:document.getElementById('pWa').value,gst:document.getElementById('pGst').value});persist();render()">Party Add Karo</button><table><tr><th>Party</th><th>City</th><th>WhatsApp</th><th>GST</th><th></th></tr>${parties.map((p,i)=>`<tr><td>${esc(p.name)}</td><td>${esc(p.city)}</td><td>${esc(p.wa||p.mobile)}</td><td>${esc(p.gst)}</td><td><button onclick="parties.splice(${i},1);persist();render()">Delete</button></td></tr>`).join("")}</table></div>`; return;}
 if(tab==="Design Master"){app.innerHTML=`<div class="card"><h2>Design Master</h2><select id="dParty">${parties.map(p=>`<option value="${p.name}">${esc(p.name)}</option>`).join("")}</select><input id="dNo" placeholder="Design No. - jaise D-53"><input id="dCat" placeholder="Category"><input id="dCol" placeholder="Colour"><input id="dRate" placeholder="Total ek Piece ka Amount - jaise 70.92"><button class="primary" onclick="designs.push({id:Date.now(),party:document.getElementById('dParty').value,no:document.getElementById('dNo').value,cat:document.getElementById('dCat').value,col:document.getElementById('dCol').value,rate:document.getElementById('dRate').value});persist();render()">Design Save Karo</button><table><tr><th>Design</th><th>Party</th><th>Rate</th><th></th></tr>${designs.map((d,i)=>`<tr><td>${esc(d.no)}</td><td>${esc(d.party)}</td><td>${esc(d.rate)}</td><td><button onclick="designs.splice(${i},1);persist();render()">Delete</button></td></tr>`).join("")}</table></div>`; return;}
 if(tab==="Job Work Challan"){app.innerHTML=`<div class="card"><h2>Job Work Challan</h2><select id="jParty">${parties.map(p=>`<option>${esc(p.name)}</option>`).join("")}</select><input id="jNo" placeholder="Job Work Challan No. - manual"><select id="jDesign">${designs.map(d=>`<option value="${d.no}|${d.rate}">${esc(d.no)} - ${esc(d.party)} - Rate ${esc(d.rate)}</option>`).join("")}</select><input id="jQty" placeholder="Qty"><button class="primary" onclick="addJob()">Add Karo</button><div id="jList"></div></div><div class="card"><h3>Job Work Challan List</h3><table><tr><th>Challan</th><th>Party</th><th>Design</th><th>Qty</th><th>Rate</th><th>Amount</th></tr>${jobs.map(j=>`<tr><td>${esc(j.no)}</td><td>${esc(j.party)}</td><td>${esc(j.design)}</td><td>${j.qty}</td><td>${j.rate}</td><td>${(num(j.qty)*num(j.rate)).toFixed(2)}</td></tr>`).join("")}</table></div>`; return;}
 if(tab==="Delivery Challan"){let next=101+deliveries.length; app.innerHTML=`<div class="card"><h2>Delivery Challan - No. ${next} se auto, badal bhi sakte ho</h2><select id="dlParty">${parties.map(p=>`<option>${esc(p.name)}</option>`).join("")}</select><input id="dlNo" value="${next}"><select id="dlJob">${jobs.map(j=>`<option value="${j.no}|${j.design}|${j.qty}|${j.rate}">${esc(j.no)} - ${esc(j.design)}</option>`).join("")}</select><input id="dlQty" placeholder="Jama Qty"><input id="dlDebit" placeholder="Debit Note Amount - 0 agar nahi hai"><input id="dlReason" placeholder="Debit Note Reason"><button class="primary" onclick="addDelivery()">Delivery Save Karo</button></div><div class="card"><table><tr><th>Delivery</th><th>Job Work</th><th>Design</th><th>Jama Qty</th><th>Amount</th><th>Debit</th><th>Final</th></tr>${deliveries.map(d=>`<tr><td>${esc(d.no)}</td><td>${esc(d.jobNo)}</td><td>${esc(d.design)}</td><td>${d.qty}</td><td>${(num(d.qty)*num(d.rate)).toFixed(2)}</td><td>${d.debit}</td><td>${(num(d.qty)*num(d.rate)-num(d.debit)).toFixed(2)}</td></tr>`).join("")}</table></div>`; return;}
 if(tab==="Billing"){app.innerHTML=`<div class="card"><h2>Billing - Sirf Delivery Challan se</h2><select id="bParty">${parties.map(p=>`<option>${esc(p.name)}</option>`).join("")}</select><select id="bDel">${deliveries.map(d=>`<option value="${d.no}|${d.jobNo}|${d.design}|${d.qty}|${d.rate}|${d.debit}">${esc(d.design)} - Delivery Challan ${esc(d.no)}</option>`).join("")}</select><input id="bInv" placeholder="Invoice No."><input id="bDate" type="date"><select id="bGst"><option value="0">GST OFF</option><option value="5">GST 5%</option><option value="12">GST 12%</option><option value="18">GST 18%</option></select><button class="primary" onclick="addBill()">Bill Banao</button></div><div id="billList">${bills.map((b,i)=>`<div class="card"><div class="bill" id="bill-${i}"><div class="bill-head"><h2>${esc((firms[0]||{}).name)}</h2><div>GSTIN : ${esc((firms[0]||{}).gst)} | Mo. ${esc((firms[0]||{}).mobile)} | PAN: ${esc((firms[0]||{}).pan)}</div><div>${esc((firms[0]||{}).address)} | State: Gujarat Code: 24</div><div>${(firms[0]||{}).logo?`<img class="logo-preview" src="${(firms[0]||{}).logo}">`:""}</div></div><p><b>M/s.</b> ${esc(b.party)}<br>Invoice No.: ${esc(b.inv)} | Date: ${esc(b.date)} | <b>Ch.No.: ${esc(b.deliveryNo)}</b> (sirf Delivery)</p><table><tr><th>Party Ch.No.</th><th>Particulars</th><th>HSN</th><th>Qty</th><th>Rate</th><th>Amount</th></tr><tr><td>${esc(b.deliveryNo)}</td><td>Dsg - No : ${esc(b.design)}</td><td></td><td>${b.qty}</td><td>${b.rate}</td><td>${(num(b.qty)*num(b.rate)).toFixed(2)}</td></tr></table><p>Less: Debit Note ${b.debit} | Total Before Tax ${(num(b.qty)*num(b.rate)).toFixed(2)} | CGST ${(num(b.qty)*num(b.rate)-num(b.debit))*num(b.gst)/200} | SGST ${(num(b.qty)*num(b.rate)-num(b.debit))*num(b.gst)/200} | <b>Total After Tax Rs. ${b.total}</b></p><p>Rs. In Words: ${inWords(b.total)}</p><p>Terms: 1. Goods Once Should not be taken back. 2. Interest At 2% p.a. Will be Charged On Unpaid Bill After Due Date. 3. Subject to SURAT Jurisdiction 4. E. & O.E.</p><p style="text-align:right">For, ${esc((firms[0]||{}).name)}<br><br>Authorised Signatory</p></div><br><button class="green" onclick="sendWA(${i})">WhatsApp pe Bhejo</button> <button onclick="bills.splice(${i},1);persist();render()">Delete Bill</button><p class="small">WhatsApp khulega, Bill ka likha hua pehle se aayega, bas Send dabao + Bill ka PDF / screenshot attach karo. Full-automatic PDF ke liye WhatsApp Business API + Server chahiye - GitHub Pages pe wo nahi chalta.</p></div>`).join("")}</div>`; return;}
 if(tab==="Payment"){app.innerHTML=`<div class="card"><h2>Payment</h2><select id="payParty">${parties.map(p=>`<option>${esc(p.name)}</option>`).join("")}</select><input id="payAmt" placeholder="Amount"><input id="payDate" type="date"><button class="primary" onclick="payments.push({id:Date.now(),party:document.getElementById('payParty').value,amt:document.getElementById('payAmt').value,date:document.getElementById('payDate').value});persist();render()">Payment Add Karo</button><table><tr><th>Party</th><th>Amount</th><th>Date</th><th></th></tr>${payments.map((p,i)=>`<tr><td>${esc(p.party)}</td><td>${esc(p.amt)}</td><td>${esc(p.date)}</td><td><button onclick="payments.splice(${i},1);persist();render()">Delete - Cheque Bounce / Clear Nahi Hua</button></td></tr>`).join("")}</table></div>`; return;}
}
function addJob(){const v=document.getElementById("jDesign").value.split("|"); jobs.push({no:document.getElementById("jNo").value,party:document.getElementById("jParty").value,design:v[0],rate:v[1],qty:document.getElementById("jQty").value});persist();render();}
function addDelivery(){const v=document.getElementById("dlJob").value.split("|"); deliveries.push({no:document.getElementById("dlNo").value,party:document.getElementById("dlParty").value,jobNo:v[0],design:v[1],qty:document.getElementById("dlQty").value,rate:v[3],debit:document.getElementById("dlDebit").value||0,reason:document.getElementById("dlReason").value});persist();render();}
function addBill(){const v=document.getElementById("bDel").value.split("|"); const base=num(v[3])*num(v[4])-num(v[5]); const gst=num(document.getElementById("bGst").value); const total=(base+base*gst/100).toFixed(2); bills.push({party:document.getElementById("bParty").value,deliveryNo:v[0],jobNo:v[1],design:v[2],qty:v[3],rate:v[4],debit:v[5],gst:gst,total:total,inv:document.getElementById("bInv").value,date:document.getElementById("bDate").value});persist();render();}
function sendWA(i){const b=bills[i]; const p=parties.find(x=>x.name===b.party); let phone=(p?.wa||p?.mobile||"").replace(/[^0-9]/g,""); if(phone.length===10) phone="91"+phone; if(!phone){alert("Party ka WhatsApp Number Party Master me nahi hai");return;} const msg=`Namaste ${b.party}, ${(firms[0]||{}).name} taraf se Bill - Bill No. ${b.inv} Date ${b.date} Ch.No. ${b.deliveryNo} Total Rs. ${b.total} - ${(firms[0]||{}).name}`; window.open("https://wa.me/"+phone+"?text="+encodeURIComponent(msg),"_blank");}
renderTabs();render();
</script></body></html>
